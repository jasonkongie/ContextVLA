              if hidden_states.shape[1] > 1:
                  self.position_ids = kwargs.get('position_ids')
                  self.cache_position = kwargs.get('cache_position')
                  self.position_embeddings = kwargs.get('position_embeddings')"""
          if old in text:
              text = text.replace(old, new)
              text = text.replace(
                  '        return self.layer(hidden_states, *args, **kwargs)',
                  '        return self.layer(hidden_states, past_key_value=past_key_value, output_attentions=output_attentions, use_cache=use_cache, **kwargs)'
              )
              open('src/models/layer_wrapper.py', 'w').write(text)
              print('layer_wrapper.py patched OK')
          else:
              print('layer_wrapper.py already patched, skipping')
          PYEOF

          python - << 'PYEOF'
          text = open('scripts/train_contextvla.py').read()
          changed = False
          if 'import datetime' not in text:
              text = text.replace('import dataclasses\nimport gc', 'import dataclasses\nimport datetime\nimport gc')
              changed = True
          old_nccl = 'torch.distributed.init_process_group(backend=backend, init_method="env://")'
          new_nccl = 'torch.distributed.init_process_group(backend=backend, init_method="env://", timeout=datetime.timedelta(seconds=3600))'
          if old_nccl in text:
              text = text.replace(old_nccl, new_nccl); changed = True
          if 'model.gradient_checkpointing_enable()' in text:
              text = text.replace('model.gradient_checkpointing_enable()', 'model.gradient_checkpointing_enable(gradient_checkpointing_kwargs={"use_reentrant": False})'); changed = True
          if 'find_unused_parameters=True' in text:
              text = text.replace('find_unused_parameters=True', 'find_unused_parameters=False'); changed = True
          old_ckpt = '            # Save checkpoint using the new mechanism\n            if (global_step + 1) % accum_steps == 0:\n                save_checkpoint(model, optim, (global_step + 1) // accum_steps, config, is_main, data_config)'
          new_ckpt = '            # Save checkpoint using the new mechanism\n            if (global_step + 1) % accum_steps == 0:\n                if use_ddp:\n                    dist.barrier()\n                save_checkpoint(model, optim, (global_step + 1) // accum_steps, config, is_main, data_config)\n                if use_ddp:\n                    dist.barrier()'
          if old_ckpt in text:
              text = text.replace(old_ckpt, new_ckpt); changed = True
          old_print = '    print(f"Saving checkpoint at step {global_step}, {config.num_train_steps}")\n    if not is_main:\n        return\n\n    # Only save if'
          if old_print in text:
              text = text.replace(old_print, '    if not is_main:\n        return\n\n    # Only save if'); changed = True
          if changed:
              open('scripts/train_contextvla.py', 'w').write(text)
              print('train_contextvla.py patched OK')
          else:
              print('train_contextvla.py already patched, skipping')
          PYEOF

          huggingface-cli login --token "$HF_TOKEN" --add-to-git-credential
          mkdir -p "$CKPT_DIR"
          echo "=== [ctx16] Starting training ==="
          torchrun \
            --standalone \
            --nnodes=1 \
            --nproc_per_node=4 \
            --master_port=19001 \
            scripts/train_contextvla.py "$CTX_CONFIG" \
            --exp-name="$EXP_NAME" \
            --num-train-steps=10000 \
            --batch-size=16 \
            --accum-steps=2 \
            --checkpoint-base-dir="$CKPT_DIR" \
            --no-resume
          echo "=== [ctx16] Training complete ==="
        volumeMounts:
        - name: jasonkong-volume
          mountPath: /mymnt
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: jasonkong-volume
        persistentVolumeClaim:
          claimName: jasonkong-volume
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 32Gi
